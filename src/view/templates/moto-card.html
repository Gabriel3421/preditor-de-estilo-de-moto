<div class="col-md-3">
    <div class="card moto-card">
        <div class="card-body">
            <span class="badge bg-secondary align-self-start mb-2">{{category}}</span>
            <h6 class="card-title">{{name}}</h6>
            <p class="card-text text-muted small mb-2">
                {{cilindrada}} cc · {{price}}
            </p>
            {{scoreBadge}}
            <button class="btn btn-sm btn-primary buy-now-btn" data-product='{{product}}'>
                <i class="bi bi-plus-circle"></i> Add à garagem
            </button>
        </div>
    </div>
</div>
